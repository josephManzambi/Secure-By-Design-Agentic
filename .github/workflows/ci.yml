# ==================================================================
# Secure-By-Design-Agentic — CI
# ==================================================================
# CI runs:
#   - Ruff (lint + bandit-style security checks via the S ruleset)
#   - Module import smoke test (verifies the project can be loaded)
#   - MCP descriptor scan: starts the server, reads its tool descriptions
#     (scanner from ai-redteam-orchestrator v0.1.0, pinned by commit + sha256)
# ==================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint + security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies (with dev extras)
        run: uv sync --all-extras

      - name: Run Ruff
        # The pyproject.toml enables the S (bandit) ruleset, so this
        # catches subprocess(shell=True), hardcoded passwords, etc.
        run: uv run ruff check .

  import-smoke-test:
    name: Module import smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Verify modules import cleanly
        run: |
          uv run python -c "from agent import config, input_guard, output_filter, tool_authorizer, audit_logger"
          uv run python -c "from mcp_server import validators, rate_limiter, audit"
          # Server import without execution
          uv run python -c "from mcp_server.server import read_log, system_info, search_logs, health_check"

  mcp-descriptor-scan:
    name: MCP descriptor scan
    runs-on: ubuntu-latest
    env:
      # ai-redteam-orchestrator v0.1.0. Pinned by commit and file hash, never @latest.
      RTO_COMMIT: e0c10c7162b124242503060dfa171ed5a8f9174f
      RTO_SHA256: cb898dbb542e51823b3c9ac925077b02f827ead14fbf498e7dd5dfc1ce991ff8
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Fetch the pinned descriptor scanner
        run: |
          curl -fsSL -o "$RUNNER_TEMP/redteam_orchestrator.py" \
            "https://raw.githubusercontent.com/josephManzambi/ai-redteam-orchestrator/${RTO_COMMIT}/redteam_orchestrator.py"
          echo "${RTO_SHA256}  $RUNNER_TEMP/redteam_orchestrator.py" | sha256sum -c -

      - name: Scan the secure MCP server's tool descriptions
        # Fails on any CRITICAL or HIGH finding, or if the server does not
        # start and list its tools. Heuristic keyword checks, not a proof.
        run: |
          uv run python mcp-scan/descriptor_scan.py \
            "$RUNNER_TEMP/redteam_orchestrator.py" \
            mcp-scan/mcp_client_config.json \
            mcp_descriptor_scan.json

      - name: Upload descriptor scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-descriptor-scan-results
          path: mcp_descriptor_scan.json
          retention-days: 30
          if-no-files-found: ignore
