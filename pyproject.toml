[project]
name = "secure-by-design-agentic"
version = "0.1.0"
description = "Reference implementation of a secure-by-design AI agent and MCP server, mapped to OWASP, NIST, and CSA controls"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Joseph Manzambi", email = "joseph@manzambi.com" },
]
keywords = ["ai-security", "red-team", "mcp", "owasp", "nist", "csa", "llm-security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    # MCP Server
    "mcp[cli]>=1.0.0",
    # Ollama SDK (thin client for local inference)
    "ollama>=0.4.0",
    # Logging & output
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/josephManzambi/Secure-By-Design-Agentic"
Documentation = "https://github.com/josephManzambi/Secure-By-Design-Agentic/tree/main/docs"
Repository = "https://github.com/josephManzambi/Secure-By-Design-Agentic"
Issues = "https://github.com/josephManzambi/Secure-By-Design-Agentic/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "mcp_server"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "S", "B", "UP"]
# S = bandit security checks — important for this project

[tool.ruff.lint.per-file-ignores]
# Regex literals that *describe* sensitive shapes look like passwords to bandit.
"agent/output_filter.py" = ["S105", "S106"]
# Logging must never crash the agent — broad except + pass is intentional.
"agent/audit_logger.py" = ["S110", "BLE001"]
"mcp_server/audit.py" = ["S110", "BLE001"]
# Base64 decode-or-skip in encoding-attack detection is intentional.
"agent/input_guard.py" = ["S110", "BLE001"]
# `grep` on PATH is documented; not using full path is a deliberate choice
# for portability across distros (the security control is shell=False, not the path).
"mcp_server/server.py" = ["S603", "S607"]
